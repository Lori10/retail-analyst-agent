services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retail_agent
      POSTGRES_PASSWORD: retail_agent
      POSTGRES_DB: retail_agent_reports
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_agent -d retail_agent_reports"]
      interval: 2s
      timeout: 2s
      retries: 15

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
