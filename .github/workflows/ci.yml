name: CI

on:
  push:
  pull_request:

# Least privilege: CI only reads the repo. Actions are pinned to commit SHAs (public repo).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id `checks` is the required status check in the main ruleset; don't rename it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same image as docker-compose.yml; tests use the separate _test database.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: retail_agent
          POSTGRES_PASSWORD: retail_agent
          POSTGRES_DB: retail_agent_reports_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail_agent -d retail_agent_reports_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # check.sh diffs tests/ against main
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: uv sync --frozen
      - run: git branch -f main origin/main 2>/dev/null || true
      # Same gates as /verify locally: ruff, offline pytest, openspec validate, weakened-test scan.
      # Live tests and eval are never run in CI.
      - run: .claude/skills/verify/check.sh
